<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Here's a QR code</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap');

  :root {
    --bg: #eceef1;
    --ink: #14161a;
    --accent: #0e7c86;
    --module: rgba(14, 20, 26, 0.06);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;

    /* module grid, evoking QR data pixels, fading from the corners */
    background-image:
      linear-gradient(90deg, var(--module) 1px, transparent 1px),
      linear-gradient(var(--module) 1px, transparent 1px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(circle at center, black 5%, transparent 72%);
    mask-image: radial-gradient(circle at center, black 5%, transparent 72%);
  }

  main {
    text-align: center;
    max-width: 640px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 18px;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .rule {
    width: 40px;
    height: 2px;
    background: var(--accent);
    margin: 28px auto;
    border: 0;
  }

  footer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: rgba(20, 22, 26, 0.45);
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: no-preference) {
    h1 {
      animation: rise 0.5s ease-out both;
    }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Decoded</p>
    <h1>Here's a QR code</h1>
    <hr class="rule">
    <footer>scanned successfully</footer>
  </main>
</body>
</html>
