 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quishing Awareness</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;700&display=swap');

  :root {
    --bg: #1c1712;
    --ink: #f5efe6;
    --accent: #ff8a3d;
    --accent-dim: #7a4a24;
    --module: rgba(255, 138, 61, 0.08);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;

    background-image:
      repeating-linear-gradient(45deg, var(--module) 0, var(--module) 1px, transparent 1px, transparent 14px);
  }

  main {
    text-align: center;
    max-width: 620px;
    border: 1px solid var(--accent-dim);
    padding: 48px 36px;
    background: rgba(0, 0, 0, 0.15);
  }

  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 22px;
  }

  .tag::before {
    content: '⚠ ';
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: clamp(1.5rem, 5vw, 2.3rem);
    line-height: 1.4;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }

  .rule {
    width: 40px;
    height: 2px;
    background: var(--accent);
    margin: 26px auto;
    border: 0;
  }

  p.msg {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--ink);
    margin: 0 0 6px;
  }

  footer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: rgba(245, 239, 230, 0.4);
    letter-spacing: 0.04em;
    margin-top: 30px;
  }
</style>
</head>
<body>
  <main>
    <p class="tag">Security Notice</p>
    <h1>This is a phishing QR code<br>(quishing).</h1>
    <hr class="rule">
    <p class="msg">Please be aware and be SAFE!</p>
  </main>
</body>
</html>
